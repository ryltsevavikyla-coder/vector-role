---
vector_version: "0.22.1"
vector_clickhouse_ip: "localhost"
vector_clickhouse_port: 8123
clickhouse_db_name: "logs"
clickhouse_table_name: "data_logs"
vector_config:
  sources:
    demo_logs:
      type: demo_logs
      format: syslog
  sinks:
    to_clickhouse:
      type: clickhouse
      inputs:
        - demo_logs
      database: "{{ clickhouse_db_name }}"
      endpoint: "http://{{ vector_clickhouse_ip }}:{{ vector_clickhouse_port }}"
      table: "{{ clickhouse_table_name }}"
      compression: gzip
      healthcheck: true
      skip_unknown_fields: true
